[package]
name = "aviary-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
getrandom = "0.3"
hex = "0.4"
pbkdf2 = { version = "0.13", features = ["sha2"] }
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[profile.release]
lto = "thin"
strip = true

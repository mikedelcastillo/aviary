[project]
name = "aviary"
version = "0.1.0"
description = "Object detection across camera streams and model training"
requires-python = ">=3.11"
dependencies = [
    # opencv (cv2) is pulled in transitively by ultralytics; no GUI calls are
    # made anywhere in the repo, and the server image installs libgl1.
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.0",
    "requests>=2.32.0",
    "rich>=13.7.0",
    "ultralytics>=8.3.0",
    # OpenRGB SDK client for the LED status display (lib.rgb). Pure-python, tiny;
    # the engine no-ops gracefully if the OpenRGB server isn't running.
    "openrgb-python>=0.3.2",
    # Tapo proprietary local-API client (lib.tapo): spotlight flash + remote
    # camera reboot, which Tapo's ONVIF can't do. Imported lazily; dormant
    # until TAPO_CLOUD_PASSWORD is set.
    "pytapo>=3.4",
    # torch/torchvision come from the CUDA 11.8 (cu118) index below — the last
    # build line that supports the GTX 1060 (Pascal, sm_61): cu128's cuDNN 9
    # refuses SM < 7.5 and its kernels start at sm_75, so a cu128 torch crashes
    # every inference with "GET was unable to find an engine". torch 2.7.1 is
    # the final cu118 release; `uv sync` installs the right GPU torch with no
    # post-step.
    "torch==2.7.1",
    "torchvision==0.22.1",
]

# Every operational script is a console command: `uv run <name>`. Names are
# hyphen-case; the Python modules/functions they map to stay underscore.
[project.scripts]
server = "lib.server_ctl:server"
server-up = "lib.server_ctl:up"
server-down = "lib.server_ctl:down"
llm-harness = "lib.ai.harness:main"
activity-harness = "lib.ai.activity_harness:main"
memory-migrate = "lib.memory_migrate:main"
train = "train:main"
train-live = "train_live:main"
train-archive = "train_archive:main"
prepare-dataset = "prepare_dataset:main"
benchmark = "benchmark:main"
evaluate = "evaluate:main"
suggest = "suggest:main"
import-collect-birds = "import_collect_birds:main"
import-immich-albums = "import_immich_albums:main"
extract-frames = "extract_frames:main"
synth-ir = "synth_ir:main"
cut-paste-ir = "cut_paste_ir:main"
annotation = "annotation_app:main"
doctor-fsdb = "doctor_fsdb:main"
tests = "pytest:console_main"
# RGB LED status display (lib.rgb)
rgb-calibrate = "lib.rgb.calibrate:main"
rgb-demo = "lib.rgb.cli:demo"
rgb-status = "lib.rgb.cli:status"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The subsystem packages (prefix stripped so they import top-level), ...
[tool.hatch.build.targets.wheel]
packages = [
    "server/lib",
    "training/aviary_training",
]

# ... plus each standalone script mapped explicitly to a top-level module, so
# `train`, `benchmark`, ... import cleanly as their entry points expect.
[tool.hatch.build.targets.wheel.force-include]
"training/scripts/train.py" = "train.py"
"training/scripts/train_live.py" = "train_live.py"
"training/scripts/train_archive.py" = "train_archive.py"
"training/scripts/train_pipeline.py" = "train_pipeline.py"
"training/scripts/evaluate.py" = "evaluate.py"
"training/scripts/prepare_dataset.py" = "prepare_dataset.py"
"training/scripts/extract_frames.py" = "extract_frames.py"
"training/scripts/benchmark.py" = "benchmark.py"
"training/scripts/suggest.py" = "suggest.py"
"training/scripts/import_collect_birds.py" = "import_collect_birds.py"
"training/scripts/import_immich_albums.py" = "import_immich_albums.py"
"training/scripts/synth_ir.py" = "synth_ir.py"
"training/scripts/cut_paste_ir.py" = "cut_paste_ir.py"
"training/scripts/annotation_app.py" = "annotation_app.py"
"training/scripts/doctor_fsdb.py" = "doctor_fsdb.py"

# Pin torch/torchvision to the CUDA 11.8 (cu118) wheels — the last build line
# that supports the GTX 1060 (Pascal, sm_61) the server runs on. The machine is
# Linux + GTX 1060 only, so `uv sync` resolves the cu118 torch compatible with
# ultralytics directly. Note Pascal runs fp16 at ~1/64 fp32 throughput, so
# nothing here should force half precision.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[dependency-groups]
dev = ["pytest>=8.0.0"]
